version: "2"
run:
  timeout: 5m

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - goheader
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 15
    decorder:
      dec-order:
        - const
        - var
        - type
        - func
    errcheck:
      exclude-functions:
        - os.Setenv
        - os.Unsetenv
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*github.com/gomodule/redigo/redis.Pool).Close
        - (github.com/gomodule/redigo/redis.Conn).Close
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 50
    funcorder:
      constructor: true
      struct-method: false
      alphabetical: false
    gocognit:
      min-complexity: 60
    mnd:
      checks:
        - condition
        - operation
        - return
    revive:
      rules:
        - name: comment-spacings
          arguments:
            - nolint
          severity: warning
          disabled: false
        - name: constant-logical-expr
          severity: warning
          disabled: false
        - name: datarace
          severity: warning
          disabled: false
        - name: defer
          severity: warning
          disabled: false
        - name: duplicated-imports
          severity: warning
          disabled: false
        - name: early-return
          severity: warning
          disabled: false
        - name: error-naming
          severity: warning
          disabled: false
        - name: error-strings
          severity: warning
          disabled: false
        - name: exported
          severity: warning
          disabled: false
        - name: optimize-operands-order
          severity: warning
          disabled: false
        - name: package-comments
          disabled: true
        - name: range-val-in-closure
          severity: warning
          disabled: false
        - name: range-val-address
          severity: warning
          disabled: false
        - name: superfluous-else
          severity: warning
          disabled: false
        - name: time-equal
          severity: warning
          disabled: false
        - name: unused-parameter
          severity: warning
          disabled: false
        - name: use-any
          severity: warning
          disabled: false
        - name: waitgroup-by-value
          severity: warning
          disabled: false
    tagliatelle:
      case:
        rules:
          json: snake
    testifylint:
      disable:
        - require-error
    wsl_v5:
      disable:
        - defer

  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: json is a global variable
      - path: (.+)\.go$
        text: ST1000
      - path: internal/rpc
        text: ST1003
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
          - gocyclo
          - funlen
          - gosec
          - lll
      - path: _test\.go
        text: unused-parameter

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt

  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  fix: true
